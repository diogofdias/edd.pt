<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia enviado — Equipa Diogo Dias</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://edd.pt/obrigado-guia.html">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="/assets/analytics.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tinta:  #0E1218;
      --latao:  #B8935A;
      --linho:  #F2EDE4;
      --pedra:  #D8CFBE;
      --ff-display: 'Cormorant Garamond', Georgia, serif;
      --ff-ui:      'Outfit', system-ui, sans-serif;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--tinta);
      color: var(--linho);
      font-family: var(--ff-ui);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .wrap {
      max-width: 520px;
      width: 100%;
    }

    .check-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--latao);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      font-size: 2rem;
      color: var(--latao);
    }

    h1 {
      font-family: var(--ff-display);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 500;
      line-height: 1.2;
      color: var(--linho);
      margin-bottom: 1rem;
    }

    p {
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      line-height: 1.7;
      color: var(--pedra);
      margin-bottom: 1.25rem;
    }

    .spam-note {
      font-size: 0.875rem;
      color: var(--pedra);
      opacity: 0.75;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-block;
      background: var(--latao);
      color: var(--tinta);
      font-family: var(--ff-ui);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.85rem 2rem;
      border-radius: 2px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .logo-link {
      display: block;
      margin-top: 3rem;
      text-decoration: none;
    }

    .logo-link img { opacity: 0.4; transition: opacity 0.2s; width: 180px; height: auto; }
    .logo-link:hover img { opacity: 0.65; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="check-circle">✓</div>

    <h1>Guia enviado para o seu&nbsp;e‑mail!</h1>

    <p>Receberá em breve o link de acesso ao <em>Guia do Vendedor</em> no endereço que indicou.</p>

    <p class="spam-note">Não encontra o e-mail? Verifique a pasta de spam ou contacte-nos em <a href="mailto:diogo.dias@kwportugal.pt" style="color:var(--latao);">diogo.dias@kwportugal.pt</a>.</p>

    <a class="btn" href="https://edd.pt/">Voltar ao site</a>

    <a class="logo-link" href="https://edd.pt/" aria-label="Equipa Diogo Dias">
      <img src="/assets/logo-negativo.svg" alt="Equipa Diogo Dias" width="180">
    </a>
  </div>
</body>
</html>
